name: Validate platform release
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Backend dependencies
        run: python -m pip install -r cas/backend/requirements.txt
      - name: Backend and access policy
        run: python -m unittest discover -s cas/backend -v
      - name: Isolated Linux deployment fixtures
        run: sudo "$(command -v python)" -m unittest discover -s tests -v
      - name: Shell syntax
        run: for script in setup.sh install.sh rollback.sh cas/update.sh cas/rollback.sh; do bash -n "$script"; done
      - name: Runtime and portable archive
        run: |
          node blocks/tests/live.cjs
          node blocks/tests/project-archive.cjs
          node blocks/tests/ui.cjs
          node blocks/tests/serial.cjs
      - name: Browser test dependencies
        run: npm install --no-save playwright@1.57.0 && npx playwright install --with-deps chromium
      - name: Header, sign-in and account menus
        run: node blocks/browser-tests/release-header.cjs
